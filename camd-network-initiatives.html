<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAMD Network Campus Initiatives</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    /* WordPress Override Styles */
    .site-content, 
    .entry-content,
    .content-area,
    article,
    main {
        max-width: 100% !important;
        width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    /* Force footer below */
    .site-footer,
    footer {
        clear: both;
        width: 100%;
        position: relative;
        margin-top: 40px;
    }
    
    /* Merged body styles */
    body {
        font-family: 'Georgia', 'Garamond', serif;
        background: linear-gradient(135deg, #2C3E2E 0%, #4A5F4D 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        max-width: 100% !important;
        width: 100% !important;
    }
    
    .presentation {
        width: 100%;
        max-width: 1000px;
        background: #FDFBF7;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 1;
        margin: 0 auto !important;
    }
    
    /* ... rest of your styles remain the same ... */
</head>
<body>
    <div class="presentation">
        <div class="slide active" data-slide="1">
            <div class="slide-header">
                <h1 class="slide-title">CAMD Network Campus Initiatives</h1>
                <p class="slide-subtitle">Strategic Proposals for Mills College at Northeastern</p>
            </div>
            <div class="content-section">
                <p class="section-text">Three strategic initiatives designed to activate network campus spaces, strengthen industry partnerships, and support enrollment growth through innovative experiential education opportunities.</p>
            </div>
            <div class="benefits-grid">
                <div class="benefit-card">
                    <div class="benefit-title">Space Activation</div>
                    <div class="benefit-text">Leverage underutilized facilities and specialized infrastructure at Mills</div>
                </div>
                <div class="benefit-card">
                    <div class="benefit-title">Faculty Engagement</div>
                    <div class="benefit-text">Deploy expertise and knowledge across the network</div>
                </div>
                <div class="benefit-card">
                    <div class="benefit-title">Industry Partnerships</div>
                    <div class="benefit-text">Deepen connections with regional creative industry partners</div>
                </div>
                <div class="benefit-card">
                    <div class="benefit-title">Enrollment Growth</div>
                    <div class="benefit-text">Increase visibility and differentiation through innovative programs</div>
                </div>
            </div>
            <div class="contact-info">
                Prepared by David, Associate Director of PhD Programs | College of Arts, Media and Design
            </div>
        </div>

        <div class="slide" data-slide="2">
            <h2 class="initiative-title">Third-Year "Year-In" for Creative Practice</h2>
            <p class="initiative-subtitle">Split Co-op/Coursework Opportunity at Mills</p>
            
            <div class="content-section">
                <h3 class="section-heading">Overview</h3>
                <p class="section-text">Third-year BFA students spend an academic year at Mills College combining half-time co-op work with local Oakland industry partners and coursework that advances their artistic practice.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Key Benefits</h3>
                <p class="section-text">Activates Mills spaces and faculty expertise while leveraging existing arts infrastructure unavailable in Boston. Provides students with integrated professional and academic development in a thriving creative market.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Development Status</h3>
                <p class="section-text">Collaboratively developed by Co-op Coordinator Isabel Dmitruk and Associate Professor Jamal Thorne with substantial planning complete. Ready for implementation discussions.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Strategic Alignment</h3>
                <p class="section-text">Addresses space utilization, faculty activation, network campus engagement, experiential education, and industry partnership goals simultaneously.</p>
            </div>
        </div>

        <div class="slide" data-slide="3">
            <h2 class="initiative-title">Summer Creative Industry Intensives</h2>
            <p class="initiative-subtitle">Competitive Project-Based Network Programs</p>
            
            <div class="content-section">
                <h3 class="section-heading">Overview</h3>
                <p class="section-text">Competitively selected student teams travel to network campuses for summer-long, project-based collaborations with industry partners. Alternative to traditional study abroad programs with professional deliverables and portfolio development.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Program Structure</h3>
                <p class="section-text">Projects released in fall semester with spring acceptances. Summer residency includes intensive work with industry partner, culminating in presentation to university and partner stakeholders. Potential for course credit during low-enrollment summer terms.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Interdisciplinary Design</h3>
                <p class="section-text">Teams selected for diverse disciplinary backgrounds, fostering cross-departmental collaboration and reflecting real-world creative industry practices.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Strategic Alignment</h3>
                <p class="section-text">Activates network industry partnerships, provides alternative experiential education pathways, supports summer enrollment, and creates replicable model across network campuses.</p>
            </div>
        </div>

        <div class="slide" data-slide="4">
            <h2 class="initiative-title">Creative Problem Solving Incubator</h2>
            <p class="initiative-subtitle">Network-Wide Applied Research and Development Nodes</p>
            
            <div class="content-section">
                <h3 class="section-heading">Overview</h3>
                <p class="section-text">Network campuses with strong CAMD presence establish local hubs connecting industry, community organizations, and nonprofits with students and faculty for applied research addressing societal challenges through creative methodologies.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Model Precedent</h3>
                <p class="section-text">Builds on the success of the Data Theater Collaborative, demonstrating CAMD's unique interdisciplinary approach to problem-solving that differentiates the college from traditional academic units.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Visibility and Recognition</h3>
                <p class="section-text">Creates local and national visibility through community-engaged work, supporting enrollment growth and establishing CAMD's distinctive value proposition in collaborative, creative problem-solving.</p>
            </div>
            
            <div class="content-section">
                <h3 class="section-heading">Strategic Alignment</h3>
                <p class="section-text">Combines community engagement, creative entrepreneurship, collaborative interdisciplinary research, and multiple university priorities in a scalable, replicable framework demonstrating CAMD's unique contributions.</p>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-button" id="prevBtn" onclick="changeSlide(-1)">Previous</button>
            <span class="slide-counter"><span id="currentSlide">1</span> / 4</span>
            <button class="nav-button" id="nextBtn" onclick="changeSlide(1)">Next</button>
        </div>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 4;

        function showSlide(n) {
            const slides = document.querySelectorAll('.slide');
            const counter = document.getElementById('currentSlide');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (n > totalSlides) {
                currentSlide = totalSlides;
            }
            if (n < 1) {
                currentSlide = 1;
            }

            slides.forEach(slide => {
                slide.classList.remove('active');
            });

            slides[currentSlide - 1].classList.add('active');
            counter.textContent = currentSlide;

            prevBtn.disabled = currentSlide === 1;
            nextBtn.disabled = currentSlide === totalSlides;
        }

        function changeSlide(direction) {
            currentSlide += direction;
            showSlide(currentSlide);
        }

        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') {
                changeSlide(-1);
            } else if (event.key === 'ArrowRight') {
                changeSlide(1);
            }
        });

        showSlide(currentSlide);
    </script>
</body>
</html>
